apiVersion: apps/v1
kind: Deployment   #"You are a manager, not a worker."
metadata:
  name: auth-server         #The manager's name is auth.
spec:
  replicas: 1     #"Always keep 1 running. Not 0, not 2."
  strategy:
    rollingUpdate:
      maxUnavailable: 0   # never remove a working Pod before the new one is Ready
      maxSurge: 1
  selector:
    matchLabels:
      app: auth-server               # (A) which Pods do I manage?
  template:                 # ---- everything below describes a Pod ----
    metadata:
      labels:
        app: auth-server             # (B) MUST match (A), and the Service selects on it
    spec:
      serviceAccountName: auth-server
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: auth-server
          image: shorten/auth-server:2709732-nonroot
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: shorten-config
            - secretRef:
                name: shorten-secrets
          ports:
            - containerPort: 4000
          startupProbe:
            httpGet: { path: /health, port: 4000 }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /health, port: 4000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 4000 }
            periodSeconds: 10
          resources:
            requests: { memory: 64Mi, cpu: 50m }
            limits:   { memory: 256Mi, cpu: 500m }
