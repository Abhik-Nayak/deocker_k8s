apiVersion: v1
kind: ServiceAccount
metadata:
  name: ui
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-server
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: short-server
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: short-server-pod-reader
subjects:
  - kind: ServiceAccount
    name: short-server
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
