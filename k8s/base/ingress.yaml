apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shorten
spec:
  ingressClassName: nginx
  rules:
    - host: shorten.local
      http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: auth-server
                port:
                  number: 4000
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: short-server
                port:
                  number: 5000
          - path: /r
            pathType: Prefix
            backend:
              service:
                name: short-server
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ui
                port:
                  number: 3000
