apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: shorten-prod

# No postgres component: prod uses RDS, reached via the DATABASE_URL Secret.
resources:
  - ../../base

images:
  - name: shorten/ui
    newName: 786174827428.dkr.ecr.ap-south-1.amazonaws.com/shorten-ui
    newTag: PLACEHOLDER
  - name: shorten/auth-server
    newName: 786174827428.dkr.ecr.ap-south-1.amazonaws.com/shorten-auth-server
    newTag: PLACEHOLDER
  - name: shorten/short-server
    newName: 786174827428.dkr.ecr.ap-south-1.amazonaws.com/shorten-short-server
    newTag: PLACEHOLDER

patches:
  - target:
      kind: ConfigMap
      name: shorten-config
    patch: |-
      - op: replace
        path: /data/PUBLIC_BASE_URL
        value: "https://shorten.example.com/r"
  - target:
      kind: Ingress
      name: shorten
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: shorten.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: shorten.example.com
  - target:
      kind: Deployment
      name: ui
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
