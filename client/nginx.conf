# Serves the React build and proxies API calls to the Express backend.
# Copied to /etc/nginx/conf.d/default.conf by the Dockerfile.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy /api to the backend.
    # "api" is the API container's name on the shared docker network (todo-net),
    # and the Service name in Kubernetes — it MUST stay exactly "api".
    # In EKS the ALB path-routes /api straight to the backend, so this is unused there.
    #
    # proxy_pass has no URI path, so the original request URI is forwarded
    # unchanged: /api/todos -> http://api:8000/api/todos (where Express mounts it).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback so React Router deep links resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed Vite assets are immutable — cache them hard.
    location /assets/ {
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    # index.html must never be cached, or clients pin to a stale asset manifest.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Liveness/readiness probe target for compose healthchecks and k8s.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
